name: Release

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      task_to_run:
        description: 'Which part of the workflow to run'
        type: choice
        options:
          - test
          - release
          - docker
          - test-freebsd-aarch64
          - release-freebsd-aarch64
        required: true
        default: 'test'
      tag_name:
        description: 'Required for "release", "release-freebsd-aarch64", or "docker" task: The tag for the action (e.g., v1.0.1)'
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: hash
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rustfmt
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -p quichash-core -p quichash -- --check

  clippy:
    name: Clippy
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            clippy-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run Clippy
        env:
          RUSTC_WRAPPER: sccache
        run: cargo clippy -p quichash-core -p quichash --all-targets --all-features -- -D clippy::all -D warnings
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
  msrv:
    name: Minimum supported Rust version
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Read rust-version from the manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' crates/quichash-core/Cargo.toml | cut -d'"' -f2)
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the declared toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: msrv-${{ steps.msrv.outputs.version }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            msrv-${{ steps.msrv.outputs.version }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            msrv-${{ steps.msrv.outputs.version }}-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Check the crate with default features
        run: cargo check -p quichash-core
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  test_and_check:
    name: Test/build on ${{ matrix.target }}
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            mode: native-test
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            mode: native-test
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            mode: native-test
          - runner: macos-14
            target: aarch64-apple-darwin
            mode: native-test
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            mode: cross-linux
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            mode: cross-linux
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            mode: cross-linux
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            mode: cross-linux
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            mode: build-only
          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            mode: freebsd-vm

    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain (stable)
        if: matrix.mode != 'freebsd-vm'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        if: matrix.mode != 'freebsd-vm'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: test-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            test-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            test-${{ runner.os }}-${{ matrix.target }}-
            test-${{ runner.os }}-
      - name: Install sccache
        if: matrix.mode != 'freebsd-vm'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install dependencies for Linux cross-compiles
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl')
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
          elif [ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          elif [ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
      - name: Configure cross-linker (Linux)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl')
        run: |
          mkdir -p ~/.cargo "$HOME/bin"
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            cat > "$HOME/bin/arm-linux-gnueabihf-gcc-wrap" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "-mno-omit-leaf-frame-pointer" ]]; then
              args+=("$arg")
            fi
          done
          exec arm-linux-gnueabihf-gcc "${args[@]}"
          EOF
            chmod +x "$HOME/bin/arm-linux-gnueabihf-gcc-wrap"
            echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
            echo "linker = \"$HOME/bin/arm-linux-gnueabihf-gcc-wrap\"" >> ~/.cargo/config.toml
            echo "CC_armv7_unknown_linux_gnueabihf=$HOME/bin/arm-linux-gnueabihf-gcc-wrap" >> "$GITHUB_ENV"
          elif [ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]; then
            echo '[target.x86_64-unknown-linux-musl]' >> ~/.cargo/config.toml
            echo 'linker = "musl-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]; then
            echo '[target.aarch64-unknown-linux-musl]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          fi
      - name: Run native tests
        if: matrix.mode == 'native-test'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --target ${{ matrix.target }} --workspace --all-features
      - name: Fast PR compile check for non-native target
        if: matrix.mode != 'native-test' && matrix.mode != 'freebsd-vm' && github.event_name == 'pull_request'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check --target ${{ matrix.target }} --workspace --all-features
      - name: Full build for non-native target
        if: matrix.mode != 'native-test' && matrix.mode != 'freebsd-vm' && github.event_name != 'pull_request'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --target ${{ matrix.target }} --workspace --all-features
      - name: Build and test in FreeBSD VM
        if: matrix.mode == 'freebsd-vm'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          sync: rsync
          copyback: false
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git cmake
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            rustc -vV
            cargo test --workspace --all-features
      - name: Smoke-test CLI version
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          EXPECTED_VERSION=$(grep -m1 '^version' crates/quichash-cli/Cargo.toml | cut -d'"' -f2)
          test "$(cargo run -q -p quichash -- version)" = "hash v${EXPECTED_VERSION}"
      - name: Show sccache stats
        if: always() && matrix.mode != 'freebsd-vm'
        run: sccache --show-stats || true

  test_freebsd_aarch64:
    name: Test on aarch64-unknown-freebsd (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test-freebsd-aarch64'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and test in FreeBSD aarch64 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          arch: aarch64
          usesh: true
          sync: rsync
          copyback: false
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git rust cmake
          run: |
            set -e
            rustc -vV
            cargo test --workspace --all-features

  build_release_artifacts:
    name: Build release for ${{ matrix.target }}
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-arch: linux-x86_64
            asset_ext: .tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os-arch: windows-x86_64
            asset_ext: .exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os-arch: macos-x86_64
            asset_ext: .tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            os-arch: macos-arm64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os-arch: linux-arm64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            os-arch: linux-armv7
            asset_ext: .tar.gz
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            os-arch: windows-arm64
            asset_ext: .exe
          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            os-arch: freebsd-x86_64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os-arch: linux-musl-x86_64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            os-arch: linux-musl-arm64
            asset_ext: .tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            release-${{ runner.os }}-${{ matrix.target }}-
            release-${{ runner.os }}-
      - name: Install sccache
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install dependencies for Linux cross-compiles
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl')
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
          elif [ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          elif [ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
      - name: Configure cross-linker (Linux)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl')
        run: |
          mkdir -p ~/.cargo "$HOME/bin"
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            cat > "$HOME/bin/arm-linux-gnueabihf-gcc-wrap" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "-mno-omit-leaf-frame-pointer" ]]; then
              args+=("$arg")
            fi
          done
          exec arm-linux-gnueabihf-gcc "${args[@]}"
          EOF
            chmod +x "$HOME/bin/arm-linux-gnueabihf-gcc-wrap"
            echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
            echo "linker = \"$HOME/bin/arm-linux-gnueabihf-gcc-wrap\"" >> ~/.cargo/config.toml
            echo "CC_armv7_unknown_linux_gnueabihf=$HOME/bin/arm-linux-gnueabihf-gcc-wrap" >> "$GITHUB_ENV"
          elif [ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]; then
            echo '[target.x86_64-unknown-linux-musl]' >> ~/.cargo/config.toml
            echo 'linker = "musl-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]; then
            echo '[target.aarch64-unknown-linux-musl]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          fi
      - name: Build binary
        if: matrix.target != 'x86_64-unknown-freebsd'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }}
      - name: Build binary in FreeBSD VM
        if: matrix.target == 'x86_64-unknown-freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          sync: rsync
          copyback: true
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git cmake
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            rustc -vV
            cargo build --release --bin hash
      - name: Package artifacts
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag_name }}" ]; then
              echo "Error: The 'tag_name' input is required when running the 'release' task."
              exit 1
            fi
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION_TAG="${{ github.ref_name }}"
          fi
          VERSION=${VERSION_TAG#v}
          echo "Building artifacts for version: $VERSION_TAG"
          if [ "${{ matrix.target }}" == "x86_64-unknown-freebsd" ]; then
            BINARY_PATH_PREFIX="target/release"
          else
            BINARY_PATH_PREFIX="target/${{ matrix.target }}/release"
          fi
          ASSET_NAME="${{ env.BINARY_NAME }}-${{ matrix.os-arch }}${{ matrix.asset_ext }}"
          if [ "${{ runner.os }}" == "Windows" ]; then
            BINARY_FILE="${{ env.BINARY_NAME }}.exe"
            cp "$BINARY_PATH_PREFIX/$BINARY_FILE" "./$ASSET_NAME"
          else
            tar -czf "$ASSET_NAME" -C "$BINARY_PATH_PREFIX" "${{ env.BINARY_NAME }}"
          fi
      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.os-arch }}
          path: ${{ env.BINARY_NAME }}-*

  release_freebsd_aarch64:
    name: Build release for aarch64-unknown-freebsd (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release-freebsd-aarch64'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Require tag_name
        run: |
          if [ -z "${{ github.event.inputs.tag_name }}" ]; then
            echo "Error: The 'tag_name' input is required when running the 'release-freebsd-aarch64' task."
            exit 1
          fi
      - name: Build release binary in FreeBSD aarch64 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          arch: aarch64
          usesh: true
          sync: rsync
          copyback: true
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git rust cmake
          run: |
            set -e
            rustc -vV
            cargo build --release --bin hash
      - name: Package artifact
        shell: bash
        run: |
          VERSION_TAG="${{ github.event.inputs.tag_name }}"
          echo "Building FreeBSD aarch64 artifact for version: $VERSION_TAG"
          ASSET_NAME="${{ env.BINARY_NAME }}-freebsd-arm64.tar.gz"
          tar -czf "$ASSET_NAME" -C target/release "${{ env.BINARY_NAME }}"
          ls -la "$ASSET_NAME"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-freebsd-arm64
          path: ${{ env.BINARY_NAME }}-freebsd-arm64.tar.gz
      - name: Upload asset to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="${{ github.event.inputs.tag_name }}"
          ASSET_NAME="${{ env.BINARY_NAME }}-freebsd-arm64.tar.gz"
          gh release upload "$VERSION_TAG" "$ASSET_NAME" --clobber

  create_github_release:
    name: Create GitHub Release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ubuntu-latest
    needs: build_release_artifacts
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          draft: true
          files: release-artifacts/*/*
