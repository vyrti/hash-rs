[package]
name = "quichash-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Reusable hashing, manifest, and verification engine for QuicHash"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vyrti/quichash"
homepage = "https://github.com/vyrti/quichash"
documentation = "https://docs.rs/quichash-core"
readme = "README.md"
keywords = ["hash", "manifest", "crypto", "blake3", "checksum"]
categories = ["cryptography", "filesystem"]

[features]
default = ["all-algorithms", "filesystem", "parallel", "mmap", "xz", "reporting"]
all-algorithms = ["md5", "sha1", "sha2", "sha3", "blake2", "blake3", "xxhash"]
md5 = ["dep:md-5"]
sha1 = ["dep:sha1"]
sha2 = ["dep:sha2"]
sha3 = ["dep:sha3"]
blake2 = ["dep:blake2"]
blake3 = ["dep:blake3"]
xxhash = ["dep:xxhash-rust"]
filesystem = ["dep:crossbeam-channel", "dep:glob", "dep:ignore", "dep:jwalk"]
parallel = ["dep:rayon", "blake3?/rayon"]
mmap = ["dep:memmap2", "blake3?/mmap"]
xz = ["dep:xz2"]
reporting = ["dep:chrono", "dep:serde_json"]

[dependencies]
blake2 = { version = "0.10", optional = true }
blake3 = { version = "1.8", default-features = false, optional = true }
chrono = { version = "0.4", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
glob = { version = "0.3", optional = true }
ignore = { version = "0.4", optional = true }
jwalk = { version = "0.9", optional = true }
md-5 = { version = "0.11", optional = true }
memmap2 = { version = "0.9", optional = true }
rayon = { version = "1.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
sha3 = { version = "0.12", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }
xz2 = { version = "0.1", optional = true }

[dev-dependencies]
hex = "0.4"
tempfile = "3.27"
