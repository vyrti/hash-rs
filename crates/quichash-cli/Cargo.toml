[package]
name = "quichash"
version.workspace = true
edition.workspace = true
description = "High-performance cryptographic hash utility with SIMD optimization"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["hash", "blake3", "sha256", "checksum", "crypto"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "hash"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
indicatif.workspace = true
quichash-core = { version = "0.0.22", path = "../quichash-core" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
xz2.workspace = true
