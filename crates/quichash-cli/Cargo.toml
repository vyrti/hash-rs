[package]
name = "quichash"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "High-performance cryptographic hash utility with SIMD optimization"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vyrti/quichash"
homepage = "https://github.com/vyrti/quichash"
documentation = "https://docs.rs/quichash"
readme = "README.md"
keywords = ["hash", "blake3", "sha256", "checksum", "crypto"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "quichash"
path = "src/lib.rs"

[[bin]]
name = "hash"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "std", "help", "usage", "error-context"], default-features = false }
indicatif = "0.18"
quichash-core = { version = "0.1.0", path = "../quichash-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"
xz2 = "0.1"
